<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Sheet Dynamic Tab Extractor</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border: #cbd5e1;
            --text: #0f172a;
            --success: #15803d;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { background: var(--primary); color: white; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; border: 1px solid var(--border); }
        label { font-weight: 600; margin-bottom: 5px; display: block; font-size: 13px; }
        input[type="text"], input[type="url"], select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 14px; margin-bottom: 10px; }
        
        .btn { padding: 12px 20px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn-primary { background-color: var(--primary); color: white; width: 100%; }
        .btn-success { background-color: var(--success); color: white; width: 100%; font-size: 16px; margin-top: 15px; }

        .selected-box { border: 2px dashed #94a3b8; padding: 15px; border-radius: 8px; background-color: #f1f5f9; margin-top: 10px; min-height: 50px; }
        .tag-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .item-tag { background: #3b82f6; color: white; border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .item-tag span.remove-btn { color: #fca5a5; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Master Sheet Dynamic Tab Extractor</h2>
        <p style="margin: 5px 0 0 0; opacity: 0.9;">Live Tabs Fetch & Direct Excel Download</p>
    </div>

    <div class="card">
        <h3>1. Web App API Config</h3>
        <label>Apps Script Web App URL</label>
        <input type="url" id="scriptUrl" value="https://script.google.com/macros/s/AKfycbzyYED8CdF50QPg2A0YgYSQXbBvsSeTcHAcOQqBWqYRUa9K6HPy4-yzOo3eZYmDrpI5/exec">
        
        <button class="btn btn-primary" onclick="fetchLiveTabs()">🔄 Fetch Available Sheet Tabs Live</button>
    </div>

    <div class="card" id="tabSelectionCard" style="display: none;">
        <h3>2. Select Tabs from Master Sheet</h3>
        <label>Sheet ke andar maujood Tabs:</label>
        <select id="tabDropdown" onchange="addSelectedTab()">
            <option value="">-- Select Tab Name --</option>
        </select>

        <label style="margin-top: 15px;">Selected Tabs (Download hone waale):</label>
        <div class="selected-box">
            <div id="selectedTags" class="tag-container">
                <span style="color: #94a3b8; font-size: 13px;">Koyi tab select nahi hua hai.</span>
            </div>
        </div>

        <button class="btn btn-success" onclick="downloadSelectedTabsExcel()">📥 Download Selected Tabs as Excel (.xlsx)</button>
    </div>
</div>

<script>
let availableTabsList = [];
let selectedTabsList = [];

function fetchLiveTabs() {
    const url = document.getElementById("scriptUrl").value.trim();
    if (!url) { alert("Please enter Apps Script URL"); return; }

    alert("Master Sheet se Tabs fetch kiye ja rahe hain...");

    fetch(url)
    .then(res => res.json())
    .then(data => {
        if (data.status === "success" && data.tabs) {
            availableTabsList = data.tabs;
            populateDropdown();
            document.getElementById("tabSelectionCard").style.display = "block";
            alert("Success! Total " + data.tabs.length + " Tabs mile.");
        } else {
            alert("Tabs fetch nahi ho paye. Error: " + JSON.stringify(data));
        }
    })
    .catch(err => {
        alert("Error fetching tabs: " + err);
    });
}

function populateDropdown() {
    const dropdown = document.getElementById("tabDropdown");
    dropdown.innerHTML = '<option value="">-- Select Tab Name --</option>';
    availableTabsList.forEach(tab => {
        if (!selectedTabsList.includes(tab)) {
            let opt = document.createElement("option");
            opt.value = tab;
            opt.innerText = tab;
            dropdown.appendChild(opt);
        }
    });
}

function addSelectedTab() {
    const dropdown = document.getElementById("tabDropdown");
    const val = dropdown.value;
    if (val && !selectedTabsList.includes(val)) {
        selectedTabsList.push(val);
        renderTags();
        populateDropdown();
    }
}

function removeTab(idx) {
    selectedTabsList.splice(idx, 1);
    renderTags();
    populateDropdown();
}

function renderTags() {
    const container = document.getElementById("selectedTags");
    container.innerHTML = "";
    if (selectedTabsList.length === 0) {
        container.innerHTML = '<span style="color: #94a3b8; font-size: 13px;">Koyi tab select nahi hua hai.</span>';
        return;
    }
    selectedTabsList.forEach((tab, idx) => {
        container.innerHTML += `
            <div class="item-tag">
                ${tab}
                <span class="remove-btn" onclick="removeTab(${idx})">✕</span>
            </div>
        `;
    });
}

function downloadSelectedTabsExcel() {
    const url = document.getElementById("scriptUrl").value.trim();
    if (selectedTabsList.length === 0) {
        alert("Kripya kam se kam ek tab select karein!");
        return;
    }

    alert("Excel file prepare ho rahi hai, download turant shuru hoga...");

    fetch(url, {
        method: "POST",
        body: JSON.stringify({ items: selectedTabsList })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === "success" && data.downloadUrl) {
            // Direct browser download window open
            window.location.href = data.downloadUrl;
        } else {
            alert("Download failed: " + JSON.stringify(data));
        }
    })
    .catch(err => {
        alert("Error generating download: " + err);
    });
}
</script>

</body>
</html>
